name: CI

on:
    push:
        branches: [main, dev]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Lint, typecheck, build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run lint -- --max-warnings=0
            - run: npm run format:check
            # Marshrut tiplari (.next/types) build'siz yaratiladi.
            - run: npx next typegen
            - run: npm run typecheck
            - run: npm run build

    docker:
        name: Docker image
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
            - run: docker build -t edums-frontend .
